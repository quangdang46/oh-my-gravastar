[package]
name = "omg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "oh-my-gravastar CLI: agent-first, offline configurator for GravaStar devices"

[[bin]]
name = "omg"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
omg-hid = { path = "../hid" }
omg-model = { path = "../model" }
ctrlc = "3"
omg-proto-he = { path = "../proto-he" }
omg-proto-mouse = { path = "../proto-mouse" }
omg-proto-khub916 = { path = "../proto-khub916" }
omg-proto-sparkplayjoy = { path = "../proto-sparkplayjoy" }
omg-music = { path = "../music" }
serde.workspace = true
serde_json.workspace = true
jsonschema = "0.30"
sha2 = "0.10"
